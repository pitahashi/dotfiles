# statusline length and color
set -g status-left-length 100
set -g status-right-length 100
set -g status-style bg=black,fg=white
set -g mouse on

# left side 
set -g status-left "#[bg=green,fg=black] #S #[fg=green,bg=black]"

# right side 
set -g status-right "#[fg=green,bg=black]#[bg=green,fg=black] %Y-%m-%d  %H:%M #[fg=green,bg=black]"

# window list location 
set-window-option -g status-justify "left"

# inactive window 
set-window-option -g window-status-format "#[fg=#ffffff,bg=black] #I: #W "

# active window 
set-window-option -g window-status-current-format "#[fg=black,bg=blue] #[fg=#ffffff]#I: #W #[fg=blue,bg=black]"

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
