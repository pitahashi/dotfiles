# statusline length and color
set -g status-left-length 100
set -g status-right-length 100
set -g status-style bg=black,fg=white
# set -g mouse on

# left side (rounded capsule)
set -g status-left ""

# right side (rounded capsule)
set -g status-right "#[fg=green,bg=black]#[fg=black,bg=green] %Y-%m-%d  %H:%M #[fg=green,bg=black]"

# window list location
set-window-option -g status-justify "left"

# inactive window (rounded capsule)
set-window-option -g window-status-format "#[fg=colour238,bg=black]#[fg=colour109,bg=colour238] #I #[fg=colour238,bg=colour235]#[fg=colour246,bg=colour235]#W #[fg=colour235,bg=black]"

# active window (rounded capsule)
set-window-option -g window-status-current-format "#[fg=blue,bg=black]#[fg=colour16,bg=blue] #I #[fg=blue,bg=colour24]#[fg=colour231,bg=colour24]#W #[fg=colour24,bg=black]"

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
